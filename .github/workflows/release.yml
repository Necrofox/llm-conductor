# Task #42 + #75: on tag v*, build Windows exe from this commit, smoke it,
# attach to a GitHub Release. Local dist/ is not a release source.
# Provenance only — not bit-identical rebuilds.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-exe:
    name: Build and publish Windows exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Match the primary local development version (CLAUDE.md §2).
          python-version: '3.13'
          cache: pip

      - name: Install package and PyInstaller
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          expected="${tag#v}"
          actual="$(python -c 'from llm_conductor import __version__; print(__version__)')"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::Tag ${tag} does not match llm_conductor.__version__=${actual} (expected ${expected}). Bump __version__ before tagging."
            exit 1
          fi
          echo "Version OK: ${actual}"

      - name: Build exe with PyInstaller
        run: pyinstaller llm-conductor.spec

      # Task #75: exercise the built exe, not the sources. Fail before Release.
      - name: Smoke frozen exe (--version, init, check)
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          python tools/smoke_frozen.py dist/llm-conductor.exe \
            --expected-version "${tag_version}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/llm-conductor.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
