# Publish sdist+wheel to PyPI on release published (or workflow_dispatch).
# Requires Trusted Publisher on PyPI for Necrofox/llm-conductor + this file name.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:  # manual run without a new GitHub Release

permissions:
  contents: read
  id-token: write   # required for OIDC / Trusted Publishing

jobs:
  pypi:
    name: Build and upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
