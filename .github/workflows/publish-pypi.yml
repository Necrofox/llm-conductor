# Publish sdist+wheel to PyPI on release published (or workflow_dispatch).
# Requires Trusted Publisher on PyPI for Necrofox/llm-conductor + this file name.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:  # select an existing release tag for manual publishing

permissions:
  contents: read
  id-token: write   # required for OIDC / Trusted Publishing

jobs:
  pypi:
    name: Build and upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != v* ]]; then
            echo "::error::Publish from a release tag vMAJOR.MINOR.PATCH, including manual runs."
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify built package version matches tag
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-deps dist/*.whl
          expected="${GITHUB_REF_NAME#v}"
          actual="$(python -c 'from importlib.metadata import version; print(version("llm-conductor"))')"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match built version ${actual}."
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
