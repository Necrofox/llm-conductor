# Key-context catalog: rules that add text to a leaf from its JSON path.
# A file next to the target, or a manifest context field, replaces this file entirely.
# Omitting [[rules]] does not restore the catalog below.
# Generated by `llm-conductor init`. Absent keys take the defaults below; unknown keys are an error.

# Reusable context texts. A rule selects one by template and may pass value.
# [templates.<name>]
# Template body. {value} is replaced from the rule.

# Rules, first match per slot wins. Speaker patterns are listed before generic suffixes.
[[rules]]
name = "speaker-male"
match = "last"
pattern = "(?i)^speaker_(?:.*_)?male$"
slot = "gender"
priority = 10
text = '''
Speaker is MALE - use masculine verb endings and pronouns if the target language marks gender there'''

[[rules]]
name = "speaker-female"
match = "last"
pattern = "(?i)^speaker_(?:.*_)?female$"
slot = "gender"
priority = 10
text = '''
Speaker is FEMALE - use feminine verb endings and pronouns if the target language marks gender there'''

[[rules]]
name = "suffix-masculine"
match = "last"
pattern = "(?i)(?:_male|_m|_masculine)$"
slot = "gender"
priority = 10
text = '''
Use MASCULINE grammatical forms if the target language has grammatical gender (male speaker/subject)'''

[[rules]]
name = "suffix-feminine"
match = "last"
pattern = "(?i)(?:_female|_f|_feminine)$"
slot = "gender"
priority = 10
text = '''
Use FEMININE grammatical forms if the target language has grammatical gender (female speaker/subject)'''

[[rules]]
name = "suffix-neuter"
match = "last"
pattern = "(?i)(?:_neutral|_n|_neuter)$"
slot = "gender"
priority = 10
text = '''
Use NEUTER grammatical forms if the target language has grammatical gender'''

[[rules]]
name = "suffix-plural"
match = "last"
pattern = "(?i)(?:_plural|_many|_multiple)$"
slot = "plural"
priority = 5
text = '''
Translate in PLURAL form (many items) if the target language distinguishes number'''

[[rules]]
name = "suffix-singular"
match = "last"
pattern = "(?i)(?:_single|_one|_singular)$"
slot = "plural"
priority = 5
text = '''
Translate in SINGULAR form (one item) if the target language distinguishes number'''

[[rules]]
name = "suffix-few"
match = "last"
pattern = "(?i)_few$"
slot = "plural"
priority = 5
text = '''
Translate for FEW items (a small count, e.g. 2-4) if the target language has a dedicated form for it'''

[[rules]]
name = "suffix-zero"
match = "last"
pattern = "(?i)(?:_zero|_none|_empty)$"
slot = "plural"
priority = 5
text = '''
Translate for ZERO items (no items) if the target language has a distinct form for it'''

[[rules]]
name = "prefix-count"
match = "last"
pattern = "(?i)^count_"
slot = "plural"
priority = 3
text = '''
Translate as a COUNTABLE noun'''

[[rules]]
name = "suffix-formal"
match = "last"
pattern = "(?i)(?:_formal|_polite|_respectful)$"
slot = "formality"
priority = 7
text = '''
Use FORMAL address forms if the target language distinguishes formal/informal address (formal tone)'''

[[rules]]
name = "suffix-informal"
match = "last"
pattern = "(?i)(?:_informal|_casual|_friendly)$"
slot = "formality"
priority = 7
text = '''
Use INFORMAL address forms if the target language distinguishes formal/informal address (casual tone)'''


# Exact sidecar map. path is a JSON array of keys/indices; these slots override regex rules. Leaf mappings never inherit to descendants.
# [[leaves]]
# Structural JSON-array path, e.g. '["dialogs",0,"text"]'.
# path = ""
# Context channel. At most one text per slot per leaf.
# slot = ""
# Orders texts of different slots in the prompt (higher first).
# priority = 0
# Context text. Set this or template, not both.
# text = ""
# Name of a [templates.<name>] entry.
# template = ""
# Replaces {value} in the template text.
# value = ""
