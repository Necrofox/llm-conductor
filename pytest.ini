; pytest configuration for llm-conductor.
;
; Three-tier layout tests/unit, tests/integration, tests/system —
; the tier marker is applied automatically from the directory
; (tests/conftest.py); you do not need to set it by hand. Selective run:
; pytest -m unit.
;
; xfail_strict: a test marked xfail for a known bug from doc/backlog.md
; that unexpectedly passes once the bug is fixed — strict turns that into
; a failure and reminds you to drop the mark.
;
; -m "not live": the live tier loads a model on 192.168.66.16 and is not
; collected by plain pytest. An explicit -m live on the command line
; overrides this value (last -m wins), but the tests still require
; LLMC_LIVE_CONFIRMED=1.

[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers -m "not live"
xfail_strict = true
markers =
    unit: pure functions and in-memory objects, no files or network
    integration: component wiring on temp files, HTTP via responses
    system: full main() run (in-process and subprocess)
    meta: docs sync (lint_debt.md, xfail table in CLAUDE.md) against actual code state
    live: real-inference run (CLAUDE.md §9.1) — excluded by default, see tests/live
    characterization(reason): pins CURRENT behaviour whose correctness is unconfirmed — see reason
