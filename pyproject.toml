[build-system]
requires = ["setuptools>=80", "setuptools-scm>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-conductor"
dynamic = ["version"]
description = "CLI pipeline for localizing nested JSON with Ollama or OpenAI-compatible LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Necrofox" },
]
keywords = [
    "localization",
    "i18n",
    "l10n",
    "llm",
    "ollama",
    "openai",
    "json",
    "translation-pipeline",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31.0,<3.0.0",
    "regex>=2024.11.6",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
    "setuptools>=80",
    "setuptools-scm>=9.2",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "responses>=0.25.0",
    "hypothesis>=6.100.0",
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
    "types-regex>=2024.11.6",
    "ruff>=0.5.0",
    "build>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/Necrofox/llm-conductor"
Repository = "https://github.com/Necrofox/llm-conductor"
Issues = "https://github.com/Necrofox/llm-conductor/issues"
Changelog = "https://github.com/Necrofox/llm-conductor/blob/main/CHANGELOG.md"

[project.scripts]
llm-conductor = "llm_conductor.cli.main:main"

[tool.setuptools_scm]
version_file = "llm_conductor/_version.py"

[tool.setuptools.packages.find]
include = ["llm_conductor*"]
