; mypy configuration for llm-conductor.
;
; Before this file, `mypy llm_conductor` ran with no flags and already found 57
; real type mismatches (see doc/lint_debt.md, 2026-10-08) — accumulated
; debt, not noise, but clearing it is a separate task (see
; doc/backlog.md). This file only pins the language version (minimum
; supported — Python 3.11, see CLAUDE.md §2) and does not add new strict
; checks, so the finding list stays within the already documented
; baseline.

[mypy]
python_version = 3.11
warn_unused_configs = True
